<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabriel Hurtado Avilés - Redirigiendo...</title>
    <meta http-equiv="refresh" content="3; url=android-es.html">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            animation: fadeIn 1s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 2rem;
        }
        .redirect-info {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
        }
        .redirect-info p {
            margin-bottom: 0.5rem;
        }
        .countdown {
            font-size: 1.5rem;
            font-weight: 700;
            color: #4ade80;
        }
        .buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3ddc84, #4ade80);
            color: #000;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(61, 220, 132, 0.3);
        }
        .btn-secondary {
            background: transparent;
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }
        .icon {
            font-size: 1.2rem;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 1.5rem;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3ddc84, #4ade80);
            width: 0%;
            animation: progress 3s linear forwards;
        }
        @keyframes progress {
            from { width: 0%; }
            to { width: 100%; }
        }
    </style>
    <script>
        let countdown = 3;
        const countdownEl = document.getElementById('countdown');
        
        const interval = setInterval(() => {
            countdown--;
            if (countdownEl) {
                countdownEl.textContent = countdown;
            }
            if (countdown <= 0) {
                clearInterval(interval);
            }
        }, 1000);
    </script>
</head>
<body>
    <div class="container">
        <div class="logo">👨‍💻</div>
        <h1>Gabriel Hurtado Avilés</h1>
        <p class="subtitle">Ingeniero en Computación · Profesor IPN ESCOM</p>
        
        <div class="redirect-info">
            <p>Redirigiendo a <strong>Portafolio Android</strong>...</p>
            <p>en <span id="countdown" class="countdown">3</span> segundos</p>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
        
        <div class="buttons">
            <a href="android-es.html" class="btn btn-primary">
                <span class="icon">🤖</span>
                Ir a Portafolio Android
            </a>
            <a href="index-es-fullstack.html" class="btn btn-secondary">
                <span class="icon">💻</span>
                Ver Portafolio Full Stack
            </a>
        </div>
    </div>

    <script>
        // Auto-redirect after 3 seconds
        setTimeout(() => {
            window.location.href = 'android-es.html';
        }, 3000);
    </script>
</body>
</html>
